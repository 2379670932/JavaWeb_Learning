<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post</title>
</head>
<body>
<h1>Post</h1>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script>
    axios({
        method:"post",
        url:"http://localhost:8080/axiosServlet",
        data:"username = list"
    }).then(function (resp){
        console.log(resp)
        alert(resp.data())
    }).catch(function (err){
        console.log(err)
    })
</script>
</body>
</html>
